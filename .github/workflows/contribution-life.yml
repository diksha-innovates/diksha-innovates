name: contribution-life
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/contribution-life.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: satomasahiro2005/contribution-life@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the SVGs to an orphan branch
        run: |
          set -euo pipefail
          staging=$(mktemp -d) && cp dist/*.svg "$staging/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf . >/dev/null 2>&1 || true
          cp "$staging"/*.svg .
          git add ./*.svg
          git commit -m "contribution-life $(date -u +%F)"
          git push -f origin output
