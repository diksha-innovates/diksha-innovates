<svg xmlns="http://www.w3.org/2000/svg" width="860" height="660" viewBox="0 0 860 660" role="img" aria-label="About, stats and projects card for Diksha's GitHub profile">
  <defs>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .sans { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="860" height="660" fill="#0a0e1a"/>

  <!-- ABOUT panel -->
  <rect x="20" y="20" width="820" height="150" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
  <text x="46" y="58" class="mono" font-size="15" fill="#39d353">&gt; ABOUT</text>
  <text x="46" y="98" class="sans" font-size="28" font-weight="700" fill="#f0f3f8">Diksha</text>
  <text x="46" y="126" class="sans" font-size="15" fill="#c9d1d9">Systems Engineer building ML-powered search &amp; recommenders.</text>
  <text x="46" y="147" class="sans" font-size="15" fill="#c9d1d9">Currently shipping ReelRank.</text>
  <text x="46" y="169" class="mono" font-size="12" fill="#8b949e">Amity University'25 &#183; 2 followers &#183; 17 repositories &#183; 0 stars</text>

  <!-- abstract avatar -->
  <rect x="742" y="40" width="78" height="78" rx="6" fill="#161b2e" stroke="#f0f3f8" stroke-width="2"/>
  <circle cx="781" cy="68" r="14" fill="#58a6ff"/>
  <path d="M758,108 Q781,82 804,108 Z" fill="#a371f7"/>

  <!-- stats panel -->
  <rect x="20" y="186" width="820" height="110" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
  <g class="sans" text-anchor="middle">
    <text x="140" y="246" font-size="44" font-weight="700" fill="#f0f3f8">7</text>
    <text x="140" y="270" class="mono" font-size="13" fill="#8b949e">PULL REQS</text>

    <text x="345" y="246" font-size="44" font-weight="700" fill="#f0f3f8">17</text>
    <text x="345" y="270" class="mono" font-size="13" fill="#8b949e">REPOS</text>

    <text x="550" y="246" font-size="44" font-weight="700" fill="#f0f3f8">0</text>
    <text x="550" y="270" class="mono" font-size="13" fill="#8b949e">STARS</text>

    <text x="740" y="246" font-size="44" font-weight="700" fill="#f0f3f8">2</text>
    <text x="740" y="270" class="mono" font-size="13" fill="#8b949e">FOLLOWERS</text>
  </g>
  <line x1="242" y1="206" x2="242" y2="276" stroke="#1f2742" stroke-width="1"/>
  <line x1="447" y1="206" x2="447" y2="276" stroke="#1f2742" stroke-width="1"/>
  <line x1="652" y1="206" x2="652" y2="276" stroke="#1f2742" stroke-width="1"/>

  <!-- PROJECTS header -->
  <text x="20" y="335" class="mono" font-size="17" fill="#39d353">&gt; PROJECTS</text>
  <line x1="150" y1="330" x2="840" y2="330" stroke="#1f2742" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- project card template via 4 groups -->
  <g>
    <rect x="20" y="352" width="400" height="140" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
    <rect x="40" y="372" width="56" height="56" rx="8" fill="#3b6fd9"/>
    <text x="110" y="392" class="sans" font-size="17" font-weight="700" fill="#f0f3f8">dhoondo</text>
    <text x="110" y="412" class="sans" font-size="13" fill="#9aa4b2">Find any Instagram reel you saved or</text>
    <text x="110" y="428" class="sans" font-size="13" fill="#9aa4b2">reposted, by describing it.</text>
    <text x="40" y="470" class="mono" font-size="12" fill="#39d353">&#9733; 0</text>
    <circle cx="340" cy="466" r="5" fill="#3572A5"/>
    <text x="352" y="470" class="mono" font-size="12" fill="#9aa4b2">Python</text>
  </g>

  <g>
    <rect x="440" y="352" width="400" height="140" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
    <rect x="460" y="372" width="56" height="56" rx="8" fill="#d97b3b"/>
    <text x="530" y="392" class="sans" font-size="17" font-weight="700" fill="#f0f3f8">reelrank</text>
    <text x="530" y="412" class="sans" font-size="13" fill="#9aa4b2">Two-tower recommender, hand-written</text>
    <text x="530" y="428" class="sans" font-size="13" fill="#9aa4b2">backprop in pure NumPy.</text>
    <text x="460" y="470" class="mono" font-size="12" fill="#39d353">&#9733; 0</text>
    <circle cx="760" cy="466" r="5" fill="#3572A5"/>
    <text x="772" y="470" class="mono" font-size="12" fill="#9aa4b2">Python</text>
  </g>

  <g>
    <rect x="20" y="504" width="400" height="140" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
    <rect x="40" y="524" width="56" height="56" rx="8" fill="#d93b6f"/>
    <text x="110" y="544" class="sans" font-size="16" font-weight="700" fill="#f0f3f8">Sleep-Analysis-EEG</text>
    <text x="110" y="564" class="sans" font-size="13" fill="#9aa4b2">Sleep-stage classification and EEG</text>
    <text x="110" y="580" class="sans" font-size="13" fill="#9aa4b2">band-power forecasting.</text>
    <text x="40" y="622" class="mono" font-size="12" fill="#39d353">&#9733; 0</text>
    <circle cx="320" cy="618" r="5" fill="#DA5B0B"/>
    <text x="332" y="622" class="mono" font-size="12" fill="#9aa4b2">Jupyter Notebook</text>
  </g>

  <g>
    <rect x="440" y="504" width="400" height="140" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
    <rect x="460" y="524" width="56" height="56" rx="8" fill="#39d353"/>
    <text x="530" y="544" class="sans" font-size="16" font-weight="700" fill="#f0f3f8">Harmful-Content-Identifier</text>
    <text x="530" y="564" class="sans" font-size="13" fill="#9aa4b2">NSFW/gore/violence classifier with</text>
    <text x="530" y="580" class="sans" font-size="13" fill="#9aa4b2">real evaluation metrics.</text>
    <text x="460" y="622" class="mono" font-size="12" fill="#39d353">&#9733; 0</text>
    <circle cx="740" cy="618" r="5" fill="#DA5B0B"/>
    <text x="752" y="622" class="mono" font-size="12" fill="#9aa4b2">Jupyter Notebook</text>
