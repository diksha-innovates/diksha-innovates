<svg xmlns="http://www.w3.org/2000/svg" width="860" height="690" viewBox="0 0 860 690" role="img" aria-label="About, stats and projects card for Diksha's GitHub profile">
  <defs>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .sans { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="860" height="690" fill="#0a0e1a"/>

  <!-- ABOUT panel -->
  <rect x="20" y="20" width="820" height="172" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
  <text x="46" y="58" class="mono" font-size="15" fill="#39d353">&gt; ABOUT</text>
  <text x="46" y="98" class="sans" font-size="28" font-weight="700" fill="#f0f3f8">Diksha</text>
  <text x="46" y="126" class="sans" font-size="15" fill="#c9d1d9">Software Engineer building AI/ML systems — recsys, CV, and tensor</text>
  <text x="46" y="147" class="sans" font-size="15" fill="#c9d1d9">internals from scratch. Currently shipping ReelRank.</text>
  <text x="46" y="176" class="mono" font-size="12" fill="#8b949e">Amity University'25 &#183; 2 followers &#183; 17 repositories &#183; 0 stars</text>

  <!-- stats panel -->
  <rect x="20" y="212" width="820" height="110" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
  <g class="sans" text-anchor="middle">
    <text x="140" y="272" font-size="44" font-weight="700" fill="#f0f3f8">7</text>
    <text x="140" y="296" class="mono" font-size="13" fill="#8b949e">PULL REQS</text>

    <text x="345" y="272" font-size="44" font-weight="700" fill="#f0f3f8">17</text>
    <text x="345" y="296" class="mono" font-size="13" fill="#8b949e">REPOS</text>

    <text x="550" y="272" font-size="44" font-weight="700" fill="#f0f3f8">0</text>
    <text x="550" y="296" class="mono" font-size="13" fill="#8b949e">STARS</text>

    <text x="740" y="272" font-size="44" font-weight="700" fill="#f0f3f8">2</text>
    <text x="740" y="296" class="mono" font-size="13" fill="#8b949e">FOLLOWERS</text>
  </g>
  <line x1="242" y1="232" x2="242" y2="302" stroke="#1f2742" stroke-width="1"/>
  <line x1="447" y1="232" x2="447" y2="302" stroke="#1f2742" stroke-width="1"/>
  <line x1="652" y1="232" x2="652" y2="302" stroke="#1f2742" stroke-width="1"/>

  <!-- PROJECTS header -->
  <text x="20" y="361" class="mono" font-size="17" fill="#39d353">&gt; PROJECTS</text>
  <line x1="150" y1="356" x2="840" y2="356" stroke="#1f2742" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- project card template via 4 groups -->
  <g>
    <rect x="20" y="378" width="400" height="140" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
    <rect x="40" y="398" width="56" height="56" rx="8" fill="#3b6fd9"/>
    <text x="110" y="418" class="sans" font-size="17" font-weight="700" fill="#f0f3f8">dhoondo</text>
    <text x="110" y="438" class="sans" font-size="13" fill="#9aa4b2">Find any Instagram reel you saved or</text>
    <text x="110" y="454" class="sans" font-size="13" fill="#9aa4b2">reposted, by describing it.</text>
    <text x="40" y="496" class="mono" font-size="12" fill="#39d353">&#9733; 0</text>
    <circle cx="345" cy="492" r="5" fill="#3572A5"/>
    <text x="357" y="496" class="mono" font-size="12" fill="#9aa4b2">Python</text>
  </g>

  <g>
    <rect x="440" y="378" width="400" height="140" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
    <rect x="460" y="398" width="56" height="56" rx="8" fill="#d97b3b"/>
    <text x="530" y="418" class="sans" font-size="17" font-weight="700" fill="#f0f3f8">reelrank</text>
    <text x="530" y="438" class="sans" font-size="13" fill="#9aa4b2">Two-tower recommender, hand-written</text>
    <text x="530" y="454" class="sans" font-size="13" fill="#9aa4b2">backprop in pure NumPy.</text>
    <text x="460" y="496" class="mono" font-size="12" fill="#39d353">&#9733; 0</text>
    <circle cx="765" cy="492" r="5" fill="#3572A5"/>
    <text x="777" y="496" class="mono" font-size="12" fill="#9aa4b2">Python</text>
  </g>

  <g>
    <rect x="20" y="530" width="400" height="140" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
    <rect x="40" y="550" width="56" height="56" rx="8" fill="#d93b6f"/>
    <text x="110" y="570" class="sans" font-size="16" font-weight="700" fill="#f0f3f8">Sleep-Analysis-EEG</text>
    <text x="110" y="590" class="sans" font-size="13" fill="#9aa4b2">Sleep-stage classification and EEG</text>
    <text x="110" y="606" class="sans" font-size="13" fill="#9aa4b2">band-power forecasting.</text>
    <text x="40" y="648" class="mono" font-size="12" fill="#39d353">&#9733; 0</text>
    <circle cx="273" cy="644" r="5" fill="#DA5B0B"/>
    <text x="285" y="648" class="mono" font-size="12" fill="#9aa4b2">Jupyter Notebook</text>
  </g>

  <g>
    <rect x="440" y="530" width="400" height="140" rx="10" fill="#10152a" stroke="#1f2742" stroke-width="1"/>
    <rect x="460" y="550" width="56" height="56" rx="8" fill="#39d353"/>
    <text x="530" y="570" class="sans" font-size="16" font-weight="700" fill="#f0f3f8">Harmful-Content-Identifier</text>
    <text x="530" y="590" class="sans" font-size="13" fill="#9aa4b2">NSFW/gore/violence classifier with</text>
    <text x="530" y="606" class="sans" font-size="13" fill="#9aa4b2">real evaluation metrics.</text>
    <text x="460" y="648" class="mono" font-size="12" fill="#39d353">&#9733; 0</text>
    <circle cx="693" cy="644" r="5" fill="#DA5B0B"/>
    <text x="705" y="648" class="mono" font-size="12" fill="#9aa4b2">Jupyter Notebook</text>
  </g>
